<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Chronomètre de classe à thèmes festifs : ambiances qui évoluent avec le temps, annonces vocales et son de fin.">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; height: 100%; }
body { margin: 0; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Chrono de classe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Creepster&family=Mountains+of+Christmas:wght@700&family=Cinzel+Decorative:wght@700&family=Dancing+Script:wght@700&family=Bungee&family=Fredoka:wght@600&family=Bubblegum+Sans&family=Alfa+Slab+One&family=Berkshire+Swash&family=Instrument+Sans:wght@400;600&display=swap">
<style>
/* Layout : écran unique de projection — nuit d'Halloween en décor (lune, toile, araignée, chauves-souris, citrouilles),
   chiffres géants au centre, réglages en bas (masqués en mode projection) */
:root {
  --night: #2b1a42;     /* fond normal */
  --night2: #3d2560;
  --warn: #9c3f0a;      /* fond "il reste peu" */
  --danger: #5c0808;    /* fond "dernière ligne droite" */
  --blood: #c4120f;
  --pumpkin: #ff8a1f;
  --candle: #ffd23f;
  --bone: #f4ead8;
  --slime: #9be15d;
  --muted: rgba(244,234,216,.6);
  --panel: rgba(10,4,16,.45);
  --line: rgba(244,234,216,.18);
  --f-digits: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-spooky: "Creepster", "Chiller", Impact, fantasy;
  --f-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-brand: var(--f-spooky);
  --digits: #ff8a1f;    /* couleur des chiffres */
  --glow: rgba(255,138,31,.5);
  --danger2: #7e0b0b;   /* pulsation de la zone rouge */
  --zc: #ffd23f; --zw: #ff8a1f; --zd: #c4120f; /* couleurs des 3 paliers (barre, pastilles, halo) */
  --flash: #c4120f;     /* clignotement final */
  color-scheme: dark;
}
/* Thèmes : chaque thème redéfinit les mêmes tokens (le thème Halloween est celui de :root) */
body[data-skin="noel"] {
  --night: #1b3352; --warn: #9a5a14; --danger: #7a0d1a; --danger2: #9a1222;
  --zc: #ffe27a; --zw: #f2a33a; --zd: #e0262f; --flash: #e0262f;
  --blood: #e0262f; --pumpkin: #f2a33a; --candle: #ffe27a; --bone: #fbf7ef;
  --muted: rgba(251,247,239,.65); --panel: rgba(4,14,30,.45); --line: rgba(251,247,239,.2);
  --digits: #fbf7ef; --glow: rgba(255,214,110,.55);
  --f-brand: "Mountains of Christmas", Georgia, serif;
}
body[data-skin="sobre"] {
  --night: #1c2b36; --warn: #8a4b06; --danger: #8c1414; --danger2: #a81c1c;
  --zc: #e9d24b; --zw: #e08a1e; --zd: #e03030; --flash: #e03030;
  --blood: #e03030; --pumpkin: #e08a1e; --candle: #e9d24b; --bone: #f3efe6;
  --muted: rgba(243,239,230,.62); --panel: rgba(0,0,0,.28); --line: rgba(243,239,230,.18);
  --digits: #f3efe6; --glow: transparent;
  --f-brand: "Big Shoulders Display", "Arial Narrow", sans-serif;
}
body[data-skin="nouvelan"] {
  --night: #161c3a; --warn: #8a6a1c; --danger: #5a1470; --danger2: #7a1c96;
  --zc: #dfe6ee; --zw: #e9b949; --zd: #d63bd6; --flash: #e9b949;
  --blood: #e0262f; --pumpkin: #e9b949; --candle: #fff1b8; --bone: #fbf6e9;
  --muted: rgba(251,246,233,.62); --panel: rgba(5,8,22,.45); --line: rgba(251,246,233,.2);
  --digits: #f5d77a; --glow: rgba(245,215,122,.55);
  --f-brand: "Cinzel Decorative", Georgia, serif;
}
body[data-skin="valentin"] {
  --night: #6b1f3f; --warn: #a3195b; --danger: #8a0018; --danger2: #b0002a;
  --zc: #ffd1dc; --zw: #ff7aa2; --zd: #ff2e4d; --flash: #ff2e4d;
  --blood: #ff2e4d; --pumpkin: #ff8a5c; --candle: #ffd1dc; --bone: #fff3f6;
  --muted: rgba(255,243,246,.68); --panel: rgba(40,4,18,.4); --line: rgba(255,243,246,.22);
  --digits: #ffe4ec; --glow: rgba(255,120,160,.6);
  --f-brand: "Dancing Script", "Brush Script MT", cursive;
}
body[data-skin="carnaval"] {
  --night: #3a1f6b; --warn: #9c1c78; --danger: #a3240e; --danger2: #c4320f;
  --zc: #38d39f; --zw: #ff4fd8; --zd: #ff6a1a; --flash: #ffe14d;
  --blood: #ff3355; --pumpkin: #ffb020; --candle: #fff066; --bone: #fffaf0;
  --muted: rgba(255,250,240,.66); --panel: rgba(16,6,36,.45); --line: rgba(255,250,240,.2);
  --digits: #ffe14d; --glow: rgba(255,80,180,.55);
  --f-brand: "Bungee", Impact, sans-serif;
}
body[data-skin="paques"] {
  --night: #3d6e8c; --warn: #b5654a; --danger: #3a2d4f; --danger2: #4d3b6b;
  --zc: #b5e8a8; --zw: #ffb84d; --zd: #9a7bd6; --flash: #fff3a0;
  --blood: #ff4d6d; --pumpkin: #ffb84d; --candle: #fff3a0; --bone: #fffdf5;
  --muted: rgba(255,253,245,.72); --panel: rgba(10,30,45,.4); --line: rgba(255,253,245,.25);
  --digits: #fff6c9; --glow: rgba(255,236,150,.6);
  --f-brand: "Fredoka", "Trebuchet MS", sans-serif;
}
body[data-skin="poisson"] {
  --night: #0d4a6b; --warn: #0a2f5a; --danger: #050d24; --danger2: #0c1e45;
  --zc: #4dd0e1; --zw: #3b6fd6; --zd: #ff4d5a; --flash: #b8f2ff;
  --blood: #ff4d5a; --pumpkin: #ffa94d; --candle: #b8f2ff; --bone: #f0fbff;
  --muted: rgba(240,251,255,.68); --panel: rgba(2,20,35,.45); --line: rgba(240,251,255,.22);
  --digits: #e6fbff; --glow: rgba(120,220,255,.55);
  --f-brand: "Bubblegum Sans", "Comic Sans MS", cursive;
}
body[data-skin="belgique"] {
  --night: #2b2b33; --warn: #8f6a00; --danger: #8a0e14; --danger2: #a8141c;
  --zc: #fbf8ee; --zw: #fdda24; --zd: #ef3340; --flash: #ef3340;
  --blood: #ef3340; --pumpkin: #fdda24; --candle: #fff6c2; --bone: #fbf8ee;
  --muted: rgba(251,248,238,.64); --panel: rgba(0,0,0,.35); --line: rgba(251,248,238,.2);
  --digits: #fdda24; --glow: rgba(253,218,36,.45);
  --f-brand: "Alfa Slab One", Rockwell, serif;
}
body[data-skin="nicolas"] {
  --night: #24264f; --warn: #8a5a12; --danger: #7a0c16; --danger2: #96121e;
  --zc: #ffe9a8; --zw: #f2b233; --zd: #e8262e; --flash: #e8262e;
  --blood: #e8262e; --pumpkin: #f2b233; --candle: #ffe9a8; --bone: #fff8ec;
  --muted: rgba(255,248,236,.65); --panel: rgba(6,6,24,.45); --line: rgba(255,248,236,.2);
  --digits: #ffe2a0; --glow: rgba(242,178,51,.5);
  --f-brand: "Berkshire Swash", Georgia, serif;
}
body[data-skin="noel"] .brand, body[data-skin="noel"] .doneMsg,
body[data-skin="nouvelan"] .brand, body[data-skin="nouvelan"] .doneMsg,
body[data-skin="valentin"] .brand, body[data-skin="valentin"] .doneMsg { font-weight: 700; }
body[data-skin="valentin"] .brand { font-size: 2rem; }
body[data-skin="paques"] .brand, body[data-skin="paques"] .doneMsg { font-weight: 600; }
body[data-skin="sobre"] .brand, body[data-skin="sobre"] .doneMsg { font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }

/* Décor propre à chaque thème */
.skin { display: none; }
body[data-skin="halloween"] .skin-halloween, body[data-skin="noel"] .skin-noel { display: contents; }

/* ---------- Décor de Noël ---------- */
.skin-noel { --spd: 1; }
body.danger .skin-noel { --spd: .35; }
.flake { position: absolute; top: -3vh; border-radius: 50%; background: #fff;
  animation: snow calc(var(--d) * var(--spd) * 1s) linear infinite; animation-delay: calc(var(--dl) * 1s); }
@keyframes snow { to { transform: translate(var(--sx), 108vh); } }
.garland-wire { position: absolute; top: 0; left: 0; width: 100%; height: 10vh; }
.garland-wire path { fill: none; stroke: #0c1a12; stroke-width: 2; vector-effect: non-scaling-stroke; }
.bulb { position: absolute; width: 1.2vmin; height: 1.9vmin; border-radius: 50% 50% 45% 45%;
  background: var(--c); box-shadow: 0 0 10px 3px var(--c); transform: translate(-50%, 1px);
  animation: twinkle 1.6s ease-in-out infinite alternate; animation-delay: var(--dl); }
@keyframes twinkle { to { opacity: .3; box-shadow: none; } }
body.danger .bulb, body.done .bulb { --c: #ff2a1a !important; animation-duration: .35s; }
.snowbank { position: absolute; bottom: -2vh; left: -5%; width: 110%; height: 14vh;
  background: radial-gradient(60% 90% at 18% 100%, #eef4fb 70%, transparent 71%),
              radial-gradient(70% 80% at 80% 100%, #dfe9f5 70%, transparent 71%); opacity: .92; }
.tree { position: absolute; bottom: 1vh; left: 2vmin; width: 20vmin; max-width: 100%; }
.tree .star { fill: #ffd84a; filter: drop-shadow(0 0 8px #ffd84a); transform-box: fill-box; transform-origin: center; animation: starGlow 2.4s ease-in-out infinite; }
@keyframes starGlow { 50% { scale: 1.15; } }
body.danger .tree .star, body.done .tree .star { fill: #ff2a1a; filter: drop-shadow(0 0 12px #ff2a1a); animation-duration: .6s; }
.gifts { position: absolute; bottom: 1vh; right: 2vmin; width: 18vmin; max-width: 100%; }

/* Entités de Noël */
.entity.sleigh { width: 26vmin; animation-duration: 11s; }
.entity.shoot { width: 22vmin; height: 2px; border-radius: 2px; opacity: 0;
  background: linear-gradient(90deg, transparent, #fff); animation: shoot 1.8s ease-out forwards; }
.entity.shoot::after { content: ""; position: absolute; right: -3px; top: -3px; width: 8px; height: 8px; border-radius: 50%;
  background: #fff; box-shadow: 0 0 12px 4px rgba(255,255,220,.9); }
@keyframes shoot { 0% { opacity: 0; transform: rotate(18deg) translateX(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: rotate(18deg) translateX(45vw); } }
html, body { height: 100%; }
body {
  background: var(--night); color: var(--bone); font-family: var(--f-ui);
  transition: background-color .9s ease;
  display: flex; flex-direction: column; position: relative;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px; box-sizing: border-box; overflow: hidden;
}
body.warn { background: var(--warn); }
body.danger { background: var(--danger); animation: pulse 1s ease-in-out infinite; }
body.done { animation: flash .45s steps(2) infinite; }
@keyframes pulse { 50% { background: var(--danger2); } }
@keyframes flash { 0% { background: var(--flash); } 50% { background: #050207; } }
/* Pulsation de la dernière ligne droite, propre à certaines fêtes */
@keyframes heartbeatBg { 0%, 30%, 100% { background: var(--danger); } 10%, 40% { background: var(--danger2); } }
@keyframes stormBg { 0%, 100% { background: var(--danger); } 50% { background: var(--danger2); } 51% { background: #d9def5; }
  52% { background: var(--danger2); } 54% { background: #eef1ff; } 56% { background: var(--danger2); } }
body[data-skin="valentin"].danger { animation: heartbeatBg 1s ease-in-out infinite; }
body[data-skin="paques"].danger { animation: stormBg 5s linear infinite; }
body[data-skin="poisson"].danger { animation-duration: 3.5s; }
body[data-skin="nouvelan"].danger { animation-duration: .5s; }

/* ---------- Décor ---------- */
.deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 55%, transparent 40%, rgba(0,0,0,.38) 100%); }

/* ---------- Entités qui apparaissent au hasard ---------- */
.entity { position: absolute; pointer-events: none; opacity: 0; }
.entity.ghost { width: 11vmin; animation: ghostRise 7s ease-in-out forwards; }
.entity.ghost svg { filter: drop-shadow(0 0 14px rgba(230,220,255,.7)); }
@keyframes ghostRise {
  0%   { opacity: 0;   transform: translateY(25vh) rotate(-4deg); }
  20%  { opacity: .85; }
  50%  { transform: translateY(0) translateX(3vw) rotate(5deg); }
  80%  { opacity: .8; }
  100% { opacity: 0;   transform: translateY(-14vh) translateX(-2vw) rotate(-3deg); }
}
.entity.witch { left: 0; width: 16vmin; opacity: 1; animation: witchFly 9s linear forwards; }
.entity.witch.rtl { animation-name: witchFlyBack; }
.entity.witch.rtl .flip { transform: scaleX(-1); }
.entity.witch svg { fill: #07030b; animation: bob 1.6s ease-in-out infinite; }
@keyframes witchFly { from { transform: translateX(-25vw) translateY(4vh); } 50% { transform: translateX(50vw) translateY(-3vh); } to { transform: translateX(125vw) translateY(5vh); } }
@keyframes witchFlyBack { from { transform: translateX(125vw) translateY(4vh); } 50% { transform: translateX(50vw) translateY(-3vh); } to { transform: translateX(-25vw) translateY(5vh); } }
.entity.eyes { display: flex; gap: 1.6vmin; animation: eyesShow 4.5s ease-in-out forwards; }
.entity.eyes i { width: 2.6vmin; height: 1.5vmin; border-radius: 50%; background: var(--slime);
  box-shadow: 0 0 12px 3px rgba(155,225,93,.75); animation: blink 4.5s forwards; }
.entity.eyes i:first-child { transform: rotate(14deg); }
.entity.eyes i:last-child { transform: rotate(-14deg); }
@keyframes eyesShow { 0% { opacity: 0; } 12% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
@keyframes blink { 0%, 30%, 34%, 60%, 64%, 100% { scale: 1 1; } 32%, 62% { scale: 1 .08; } }

/* Marcheurs : sortent du sol puis rejoignent un bord de l'écran */
.entity.walker { bottom: 0; width: 9vmin; opacity: 1; }
.walker .rise { animation: rise 1.3s ease-out both; }
.walker .fig { animation: bob .36s ease-in-out infinite alternate; }
.walker.left .fig svg { transform: scaleX(-1); }
.walker svg { display: block; overflow: visible; }
.walker .lg1, .walker .lg2, .walker .ar1, .walker .ar2 { transform-box: fill-box; transform-origin: 50% 0; }
.walker .lg1, .walker .ar2 { animation: step .72s ease-in-out infinite alternate; }
.walker .lg2, .walker .ar1 { animation: step .72s ease-in-out infinite alternate-reverse; }
.walker.slow .lg1, .walker.slow .lg2 { animation-duration: 1.1s; }
.walker.slow .fig { animation-duration: .55s; }
@keyframes step { from { rotate: -24deg; } to { rotate: 24deg; } }
@keyframes rise { from { transform: translateY(105%); } to { transform: translateY(0); } }
.walker.walker .fig { animation-name: walkBob; }
@keyframes walkBob { to { transform: translateY(-3%); } }
.walker.waddle .fig { animation: waddle .38s ease-in-out infinite alternate; transform-origin: 50% 100%; }
@keyframes waddle { from { rotate: -7deg; } to { rotate: 7deg; } }
.walker.glide .fig { animation: glide 1.2s ease-in-out infinite alternate; transform-origin: 50% 100%; }
@keyframes glide { from { rotate: -3deg; } to { rotate: 3deg; } }
.moon { position: absolute; top: 7%; right: 9%; width: 13vmin; aspect-ratio: 1; border-radius: 50%; max-width: 100%;
  background: radial-gradient(circle at 35% 35%, #fffbe8, #f1e4b8 60%, #d9c58a);
  box-shadow: 0 0 60px 20px rgba(255,244,200,.25); opacity: .9; transition: opacity .9s, filter .9s; }
.moon::before, .moon::after { content: ""; position: absolute; border-radius: 50%; background: rgba(170,150,90,.35); }
.moon::before { width: 22%; height: 22%; top: 30%; left: 55%; }
.moon::after { width: 14%; height: 14%; top: 60%; left: 30%; }
body.warn .moon { filter: sepia(1) hue-rotate(-20deg) saturate(3); }
body.danger .moon, body.done .moon { filter: sepia(1) hue-rotate(-50deg) saturate(6) brightness(.8); }

.web { position: absolute; top: 0; left: 0; width: 26vmin; height: 26vmin; opacity: .45; }
.web * { stroke: var(--bone); fill: none; stroke-width: 1.1; }

.spider { position: absolute; top: 0; left: 15vmin; display: flex; flex-direction: column; align-items: center;
  animation: dangle 6s ease-in-out infinite; }
.spider .thread { width: 1.5px; height: 20vh; background: rgba(244,234,216,.55); animation: thread 6s ease-in-out infinite; }
.spider svg { width: 7vmin; height: 7vmin; margin-top: -4px; animation: wiggle 1.2s ease-in-out infinite; }
@keyframes thread { 0%,100% { height: 14vh; } 50% { height: 26vh; } }
@keyframes dangle { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes wiggle { 50% { transform: rotate(8deg); } }
body.danger .spider .thread, body.done .spider .thread { animation-duration: 1.4s; }
body.danger .spider .thread { animation-name: threadLong; }
@keyframes threadLong { 0%,100% { height: 30vh; } 50% { height: 46vh; } }

.bat { position: absolute; left: 0; animation: fly linear infinite; }
.bat .bob { animation: bob 2.2s ease-in-out infinite; }
.bat svg { display: block; fill: #07030b; }
.bat .wl, .bat .wr { transform-box: fill-box; animation: flap .28s ease-in-out infinite alternate; }
.bat .wl { transform-origin: 100% 40%; }
.bat .wr { transform-origin: 0% 40%; }
@keyframes flap { to { transform: scaleY(.25) rotate(0deg); } }
@keyframes fly { from { transform: translateX(-20vw); } to { transform: translateX(120vw); } }
@keyframes bob { 50% { transform: translateY(5vh); } }
body.danger .bat, body.done .bat { animation-duration: 5s !important; }

.pumpkin { position: absolute; bottom: -1vmin; width: 17vmin; max-width: 100%; }
.pumpkin.l { left: 2vmin; }
.pumpkin.r { right: 2vmin; width: 13vmin; transform: scaleX(-1); }
.pumpkin { --face: var(--candle); --glow: var(--pumpkin); --fd: 0s; }
.face { fill: var(--face, var(--candle)); animation: flicker 2.6s infinite; animation-delay: var(--fd, 0s); filter: drop-shadow(0 0 6px var(--glow, var(--pumpkin))); }
.pumpkin.r { --fd: -1.3s; }
@keyframes flicker { 0%,100% { opacity: 1; } 8% { opacity: .65; } 12% { opacity: .95; } 40% { opacity: .8; } 44% { opacity: 1; } 70% { opacity: .7; } }
body.danger .pumpkin, body.done .pumpkin { --face: #ff2a1a; --glow: #ff2a1a; }

.fog { position: absolute; bottom: -6vh; left: -20%; width: 140%; height: 26vh;
  background: radial-gradient(ellipse at 30% 60%, rgba(200,180,230,.16), transparent 60%),
              radial-gradient(ellipse at 75% 70%, rgba(200,180,230,.12), transparent 55%);
  filter: blur(8px); animation: drift 18s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translateX(12%); } }

/* ---------- Décors générés (thèmes de fêtes) ---------- */
#genDeco { display: contents; --spd: 1; }
body.danger #genDeco { --spd: .4; }
#genDeco .garland-wire path { stroke: rgba(255,255,255,.35); }
.ptc { position: absolute; top: 0; animation: ptcFall calc(var(--d) * var(--spd) * 1s) linear infinite; animation-delay: calc(var(--dl) * 1s); }
.ptc.rise { animation-name: ptcRise; }
.ptc svg { display: block; width: 100%; height: auto; overflow: visible; }
@keyframes ptcFall { from { transform: translate(0, -12vh) rotate(0deg); } to { transform: translate(var(--sx), 108vh) rotate(var(--rot)); } }
@keyframes ptcRise { from { transform: translate(0, 108vh) rotate(0deg); } to { transform: translate(var(--sx), -15vh) rotate(var(--rot)); } }
.flag { position: absolute; width: 2.6vmin; height: 3.4vmin; transform: translateX(-50%); transform-origin: 50% 0;
  clip-path: polygon(0 0, 100% 0, 50% 100%); animation: swing 1.8s ease-in-out infinite alternate; animation-delay: var(--dl); }
@keyframes swing { from { rotate: -8deg; } to { rotate: 8deg; } }
.gheart { position: absolute; width: 2.4vmin; transform: translate(-50%, 2px); animation: beat 1.2s ease-in-out infinite; animation-delay: var(--dl); }
.gheart svg { display: block; width: 100%; }
@keyframes beat { 0%, 100% { scale: 1; } 15% { scale: 1.25; } 30% { scale: 1; } 45% { scale: 1.15; } }
body.danger .gheart, body.danger .flag { animation-duration: .5s; }
.fw { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene { position: absolute; bottom: 0; left: 0; width: 100%; height: 20vh; }
.landmark { position: absolute; bottom: 1vh; right: 3vmin; width: 13vmin; max-width: 100%; }
.weed { transform-box: fill-box; transform-origin: 50% 100%; animation: weedSway 3s ease-in-out infinite alternate; animation-delay: var(--dl); }
@keyframes weedSway { from { rotate: -6deg; } to { rotate: 6deg; } }
.ray { position: absolute; top: -10vh; width: 12vw; height: 95vh; transform-origin: 50% 0; transform: rotate(var(--rot));
  background: linear-gradient(180deg, rgba(200,240,255,.2), transparent); filter: blur(6px); animation: rayPulse 6s ease-in-out infinite alternate; }
@keyframes rayPulse { from { opacity: .35; } to { opacity: 1; } }
.bokeh { position: absolute; border-radius: 50%; filter: blur(14px); opacity: .35; animation: bokeh 7s ease-in-out infinite alternate; }
@keyframes bokeh { to { transform: translateY(-4vh) scale(1.15); opacity: .15; } }
.twinkle { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; animation: tw 2.5s ease-in-out infinite alternate; animation-delay: var(--dl); }
@keyframes tw { to { opacity: .15; } }

/* Entités génériques des thèmes de fêtes */
.entity.burst { opacity: 1; width: 0; height: 0; }
.burst i { position: absolute; left: 0; top: 0; width: 1.2vmin; height: .7vmin; border-radius: 1px; opacity: 0;
  animation: burstOut 2.6s cubic-bezier(.15,.7,.3,1) forwards; }
.burst i.dot { border-radius: 50%; width: .9vmin; height: .9vmin; }
.burst i.heart { width: 2.2vmin; height: auto; }
.burst i.heart svg { display: block; width: 100%; }
@keyframes burstOut { 0% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(.4); } 60% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--x), calc(var(--y) + 14vh)) rotate(var(--r)) scale(1); } }
.entity.riser { bottom: -25vmin; opacity: 1; animation: riseUp 11s linear forwards; }
.riser .sway { animation: sway 2.4s ease-in-out infinite alternate; }
.riser svg { display: block; width: 100%; overflow: visible; }
@keyframes riseUp { to { transform: translateY(-135vh); } }
@keyframes sway { from { transform: translateX(-2vmin) rotate(-5deg); } to { transform: translateX(2vmin) rotate(5deg); } }
.entity.pop { opacity: 1; animation: popLife 4.5s ease forwards; }
.pop svg { display: block; width: 100%; }
.pop .tag { font-family: var(--f-brand); color: #fff; font-size: 2.4vmin; text-align: center; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
@keyframes popLife { 0% { opacity: 0; transform: scale(.2) rotate(var(--r, 0deg)); } 12% { opacity: 1; transform: scale(1.12) rotate(var(--r, 0deg)); }
  20% { transform: scale(1) rotate(var(--r, 0deg)); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(.9) rotate(var(--r, 0deg)); } }
.entity.bottle { bottom: 0; width: 6vmin; opacity: 1; animation: bottleLife 5s ease-in-out forwards; }
@keyframes bottleLife { 0% { transform: translateY(110%); } 15%, 80% { transform: translateY(8%); } 100% { transform: translateY(110%); } }
.bottle .tilt { position: relative; transform: rotate(var(--tilt)); transform-origin: 50% 100%; }
.bottle svg { display: block; width: 100%; }
.bottle .cork { position: absolute; top: 2%; left: 33%; width: 34%; animation: cork 1.4s .9s cubic-bezier(.2,.8,.4,1) forwards; }
@keyframes cork { to { transform: translate(var(--cx), -55vh) rotate(900deg); opacity: 0; } }
.bottle .spray { position: absolute; top: -14%; left: -30%; width: 160%; height: 40%; border-radius: 50%; opacity: 0;
  background: radial-gradient(circle, rgba(255,250,220,.95), rgba(255,215,120,.5) 50%, transparent 70%); animation: spray 1.6s 1s ease-out forwards; }
@keyframes spray { 20% { opacity: 1; transform: translateY(-30%) scale(1.2); } 100% { opacity: 0; transform: translateY(-120%) scale(2); } }
.wingL, .wingR { transform-box: fill-box; animation: wingFlap .3s ease-in-out infinite alternate; }
.wingL { transform-origin: 100% 80%; }
.wingR { transform-origin: 0% 80%; }
@keyframes wingFlap { to { transform: scaleY(.4); } }
.fish .tail { transform-box: fill-box; transform-origin: 100% 50%; animation: wag .3s ease-in-out infinite alternate; }
@keyframes wag { to { transform: scaleY(.6) rotate(10deg); } }
.prop { transform-box: fill-box; transform-origin: center; animation: prop .12s linear infinite alternate; }
@keyframes prop { to { transform: scaleY(.15); } }
.walker.hop .fig { animation: hop .55s ease-in-out infinite; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-35%); } }

@media (prefers-reduced-motion: reduce) {
  .entity { display: none; }
  .ptc, .fw { display: none; }
  .flag, .gheart, .weed, .ray, .bokeh, .twinkle { animation: none !important; }
  body.danger, body.done, .bat, .bat *, .spider, .spider *, .fog, .face, .bulb, .tree .star { animation: none !important; }
  .flake { display: none; }
  body.done { background: var(--blood); }
  .bat { display: none; }
}

/* ---------- Contenu ---------- */
header, main, .settings { position: relative; z-index: 1; }
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-brand); font-size: 1.6rem; color: var(--pumpkin); letter-spacing: .04em; line-height: 1;
  text-shadow: 0 0 12px var(--glow); }
.status { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.status b { color: var(--bone); font-weight: 600; }
.head-left { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }

main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-height: 0; }
#display {
  font-family: var(--f-digits); font-weight: 800; line-height: .9;
  font-size: clamp(5.5rem, min(27vw, 46vh), 26rem); font-variant-numeric: tabular-nums;
  letter-spacing: .01em; cursor: pointer; user-select: none;
  background: none; border: 0; padding: 0; color: var(--digits);
  text-shadow: 0 0 28px var(--glow), 0 6px 0 rgba(0,0,0,.35);

}
body.warn #display { color: var(--bone); text-shadow: 0 0 30px var(--zw), 0 6px 0 rgba(0,0,0,.35); }
body.danger #display { color: #fff2ec; text-shadow: 0 0 34px var(--zd), 0 6px 0 rgba(0,0,0,.4); animation: shake .5s infinite; }
body.done #display { color: var(--bone); }
@keyframes shake { 25% { transform: translate(-2px, 1px); } 75% { transform: translate(2px, -1px); } }
@media (prefers-reduced-motion: reduce) { body.danger #display { animation: none; } }
#display:focus-visible { outline: 3px dashed var(--bone); outline-offset: 8px; }

.doneMsg { font-family: var(--f-brand); font-size: clamp(1.6rem, 5vw, 3.4rem); color: var(--bone); text-shadow: 0 0 14px #000; }
.bar { width: min(70vw, 900px); max-width: 100%; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
/* La piste porte les couleurs figées aux seuils ; le cache sombre grignote depuis la droite le temps écoulé */
.bar { position: relative; }
.bar i { position: absolute; top: 0; bottom: 0; right: 0; width: 0; background: rgba(8,3,12,.88); transition: width .25s linear; }
.hint { color: var(--muted); font-size: .88rem; text-align: center; }

.controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; transition: opacity .3s; }
button.b {
  font-family: var(--f-ui); font-weight: 600; font-size: 1rem; color: var(--bone);
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;

}
button.b:hover { background: rgba(10,4,16,.7); border-color: rgba(244,234,216,.4); }
button.b:active { transform: scale(.96); }
button.b:focus-visible { outline: 2px solid var(--candle); outline-offset: 2px; }
button.primary { background: var(--pumpkin); color: var(--night); border-color: var(--pumpkin); min-width: 140px; }
button.primary:hover { background: var(--candle); border-color: var(--candle); }
button.toggle[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
button.toggle[aria-pressed="true"] { border-color: rgba(155,225,93,.55); }

.settings { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 16px 26px; justify-content: center; align-items: center;
  padding-top: 14px; border-top: 1px solid var(--line); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: .76rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field select#skin { width: auto; cursor: pointer; }
.field input, .field select {
  font-family: var(--f-ui); font-size: 1rem; width: 6.5em; padding: 7px 9px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel); color: var(--bone); font-variant-numeric: tabular-nums;
}
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.field.inline { flex-direction: row; align-items: center; gap: 8px; }
.field.inline input { width: auto; accent-color: var(--pumpkin); }

/* ---------- Mode projection : réglages masqués, chiffres plus grands ---------- */
body.fs .settings, body.fs .hint, body.fs .status { display: none; }
body.fs #display { font-size: clamp(7rem, min(36vw, 66vh), 44rem); }
body.fs .controls { opacity: .22; }
body.fs .controls:hover, body.fs .controls:focus-within { opacity: 1; }
body.fs .brand { opacity: .7; }

<script>
(() => {
  const $ = id => document.getElementById(id);
  const body = document.body;
  const display = $("display"), progress = $("progress"), startBtn = $("startBtn"), statusEl = $("status");

  // ---------- Décor généré ----------
  (function buildWeb() {
    const svg = $("web"), R = 200, angles = [0, 15, 30, 45, 60, 75, 90].map(a => a * Math.PI / 180);
    let html = angles.map(a => `<line x1="0" y1="0" x2="${R * Math.cos(a)}" y2="${R * Math.sin(a)}"/>`).join("");
    [36, 72, 110, 150, 190].forEach(r => {
      let d = "";
      for (let i = 0; i < angles.length - 1; i++) {
        const a1 = angles[i], a2 = angles[i + 1], am = (a1 + a2) / 2, rm = r * .88;
        const x1 = r * Math.cos(a1), y1 = r * Math.sin(a1), x2 = r * Math.cos(a2), y2 = r * Math.sin(a2);
        d += `${i ? "" : `M${x1} ${y1}`} Q${rm * Math.cos(am)} ${rm * Math.sin(am)} ${x2} ${y2} `;
      }
      html += `<path d="${d}"/>`;
    });
    svg.innerHTML = html;
  })();
  (function buildBats() {
    const bat = `<svg viewBox="0 0 100 44"><g class="wl"><path d="M48 20 C38 6, 22 2, 2 10 C10 14, 12 21, 8 28 C16 23, 22 25, 26 32 C30 26, 38 25, 46 28 Z"/></g>
      <g class="wr"><path d="M52 20 C62 6, 78 2, 98 10 C90 14, 88 21, 92 28 C84 23, 78 25, 74 32 C70 26, 62 25, 54 28 Z"/></g>
      <ellipse cx="50" cy="24" rx="6" ry="9"/><path d="M45 16 L46 9 L49 15 L51 15 L54 9 L55 16 Z"/></svg>`;
    const cfg = [ [14, 9, 0, 7], [24, 13, -4, 5], [58, 16, -9, 4.5], [8, 11, -12, 6], [40, 19, -2, 3.8] ];
    $("bats").innerHTML = cfg.map(([top, dur, delay, size]) =>
      `<div class="bat" style="top:${top}%;animation-duration:${dur}s;animation-delay:${delay}s"><div class="bob" style="animation-delay:${delay / 3}s"><div style="width:${size}vmin">${bat}</div></div></div>`
    ).join("");
  })();

  (function buildSnow() {
    let html = "";
    for (let i = 0; i < 70; i++) {
      const s = (2 + Math.random() * 5).toFixed(1), d = (7 + Math.random() * 9).toFixed(1);
      html += `<div class="flake" style="left:${(Math.random() * 100).toFixed(1)}%;width:${s}px;height:${s}px;opacity:${(.45 + Math.random() * .5).toFixed(2)};--d:${d};--dl:${(-Math.random() * d).toFixed(1)};--sx:${((Math.random() - .5) * 14).toFixed(1)}vw"></div>`;
    }
    $("snow").innerHTML = html;
  })();
  (function buildBulbs() {
    const colors = ["#ff3b3b", "#3bd16f", "#ffd23f", "#3b9bff"];
    let html = "";
    for (let x = 2, i = 0; x < 100; x += 4, i++) {
      const u = (x % 50) / 50, y = 1 + 24 * u * (1 - u); // même courbe que le fil
      html += `<div class="bulb" style="left:${x}%;top:${y.toFixed(2)}vh;--c:${colors[i % 4]};--dl:${(-(i % 4) * .4).toFixed(1)}s"></div>`;
    }
    $("bulbs").innerHTML = html;
  })();

  // ---------- Thèmes ----------
  const SKINS = {

      voice: { pitch: 1, rate: 1,
        warn: t => `Il reste ${t}.`,
        danger: t => `Plus que ${t}.` }
    },
    nouvelan: {
      brand: "Chrono du Réveillon", done: "3, 2, 1… Le temps est écoulé !",
      sound: ["Feu d'artifice activé", "Feu d'artifice coupé", "Tester le feu d'artifice"],
      voice: { pitch: 1.1, rate: 1,
        warn: t => `Le compte à rebours a commencé : plus que ${t} !`,
        danger: t => `Plus que ${t} ! Préparez les cotillons !` }
    },
    valentin: {
      brand: "Chrono des amoureux", done: "Le temps est écoulé… avec amour.",
      sound: ["Harpe activée", "Harpe coupée", "Tester la harpe"],
      voice: { pitch: 1.15, rate: .9,
        warn: t => `Petit mot doux : il ne reste plus que ${t}.`,
        danger: t => `Plus que ${t}… le cœur s'emballe !` }
    },
    carnaval: {
      brand: "Chrono du Carnaval", done: "Fin du défilé : le temps est écoulé !",
      sound: ["Fanfare activée", "Fanfare coupée", "Tester la fanfare"],
      voice: { pitch: 1.2, rate: 1.05,
        warn: t => `Roulement de tambour : il reste ${t} !`,
        danger: t => `Plus que ${t} ! Le défilé touche à sa fin !` }
    },
    paques: {
      brand: "Chrono de Pâques", done: "Les œufs sont trouvés : le temps est écoulé !",
      sound: ["Cloches activées", "Cloches coupées", "Tester les cloches"],
      voice: { pitch: 1.15, rate: 1,
        warn: t => `Les cloches sonnent : il reste ${t}.`,
        danger: t => `Plus que ${t} ! Le lapin a presque fini de cacher les œufs !` }
    },
    poisson: {
      brand: "Chrono d'avril", done: "Ce n'est pas une blague : le temps est écoulé !",
      sound: ["Glouglou activé", "Glouglou coupé", "Tester le glouglou"],
      voice: { pitch: 1.3, rate: 1.05,
        warn: t => `Ce n'est pas une blague : il reste ${t} !`,
        danger: t => `Plus que ${t} ! Et ça, ce n'est pas un poisson d'avril !` }

    const wP = total > 0 ? Math.max(dP, clampP(thr("warnAt") / total * 100)) : 0;
    // Transitions floues de part et d'autre de chaque seuil (largeur limitée pour ne pas déborder sur la zone voisine)
    const bd = Math.min(4, dP, (wP - dP) / 2), bw = Math.min(4, (wP - dP) / 2, 100 - wP);
    progress.parentElement.style.background =
      `linear-gradient(90deg, var(--zd) 0 ${dP - bd}%, var(--zw) ${dP + bd}% ${wP - bw}%, var(--zc) ${wP + bw}% 100%)`;
    const done = body.classList.contains("done");
    // Le thème orange / rouge ne s'applique qu'une fois le décompte lancé (en cours ou en pause)
    const zone = done || !started ? "calm" : zoneOf(remaining);
    body.classList.toggle("warn", zone === "warn");
    body.classList.toggle("danger", zone === "danger");
    // Annonce vocale uniquement quand on entre dans une zone plus urgente pendant le décompte
    const rank = { calm: 0, warn: 1, danger: 2 };
    if (endAt && rank[zone] > rank[lastZone]) announce(zone);
    lastZone = zone;
    $("doneMsg").hidden = !done;
  }

  function loop() {
    remaining = (endAt - Date.now()) / 1000;
    if (remaining <= 0) { remaining = 0; finish(); }
    render();
  }

  function start() {
    if (remaining <= 0) return;
    stopAlarm(); audio();
    lastZone = zoneOf(remaining);
    started = true;
    endAt = Date.now() + remaining * 1000;
    run();
  }
  function run() {
    clearInterval(tick); tick = setInterval(loop, 200);
    body.classList.add("running");
    startBtn.textContent = "Pause"; setStatus("en cours");
    lockScreen();
  }
  function pause() {
    if (!endAt) return;
    clearInterval(tick); tick = null;
    remaining = Math.max(0, (endAt - Date.now()) / 1000); endAt = null;
    body.classList.remove("running");
    startBtn.textContent = "Reprendre"; setStatus("en pause"); render();
  }
  function toggle() {
    if (endAt) return pause();
    if (body.classList.contains("done")) { reset(); fsMode(false); return; }
    if (remaining > 0) fsMode(true);
    start();
  }
  // Entre / sort du mode projection sans inverser l'état courant
  function fsMode(on) {
    if (body.classList.contains("fs") !== on) toggleFs();
  }

  function reset() {
    clearInterval(tick); tick = null; endAt = null; stopAlarm(); shush();
    started = false; lastZone = "calm";
    body.classList.remove("running", "done", "warn", "danger");
    remaining = total; startBtn.textContent = "Démarrer"; setStatus("prêt"); render();
  }

  function add(sec) {
    stopAlarm(); body.classList.remove("done");
    if (endAt) {
      endAt = Math.max(Date.now(), endAt + sec * 1000);
      remaining = (endAt - Date.now()) / 1000;
      if (sec > 0) total += sec;
      lastZone = zoneOf(remaining); // pas d'annonce déclenchée par un ajustement manuel
    } else {
      remaining = Math.max(0, Math.round(remaining) + sec);
      total = remaining; save();
      startBtn.textContent = "Démarrer"; setStatus("prêt");
    }
    $("manual").value = fmt(total);
    render();
  }

  function finish() {
    clearInterval(tick); tick = null; endAt = null;
    body.classList.remove("running", "warn", "danger");
    body.classList.add("done");
    startBtn.textContent = "Recommencer"; setStatus("temps écoulé !");
    if (soundOn) endSound();
    releaseLock();
  }

  // ---------- Synthèse vocale ----------
  let frVoice = null;
  function pickVoice() {
    try {
      const vs = speechSynthesis.getVoices();
      frVoice = vs.find(v => /^fr(-|_)FR/i.test(v.lang)) || vs.find(v => /^fr/i.test(v.lang)) || null;
    } catch (e) {}
  }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text) {
    if (!voiceOn || !("speechSynthesis" in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "fr-FR"; if (frVoice) u.voice = frVoice;
      u.pitch = SKINS[skin].voice.pitch; u.rate = SKINS[skin].voice.rate; u.volume = 1;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function shush() { try { speechSynthesis.cancel(); } catch (e) {} }
  function announce(zone) {
    const V = SKINS[skin].voice;
    if (zone === "warn") speak(V.warn(spoken(thr("warnAt"))));
    if (zone === "danger") speak(V.danger(spoken(thr("dangerAt"))));
  }
  function renderVoiceBtn() {
    $("voiceBtn").setAttribute("aria-pressed", String(voiceOn));
    $("voiceBtn").textContent = voiceOn ? "Voix activée" : "Voix coupée";
  }

  // ---------- Son de fin : impact + grondement + rire de sorcière (Web Audio) ----------
  function audio() {
    try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); } catch (e) {}
    return ctx;
  }
  let master = null;
  function env(g, t, peak, a, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function noiseBuffer(sec) {
    const b = ctx.createBuffer(1, Math.floor(ctx.sampleRate * sec), ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }

  function cackle(t0, out) {
    // Écho de caverne
    const dly = ctx.createDelay(1), fb = ctx.createGain(), wet = ctx.createGain();
    dly.delayTime.value = 0.13; fb.gain.value = 0.38; wet.gain.value = 0.5;
    const voice = ctx.createGain(); voice.gain.value = 1;
    voice.connect(out); voice.connect(dly); dly.connect(fb).connect(dly); dly.connect(wet).connect(out);

    // Formants d'un "a" nasillard
    const formants = [[900, 7, 1], [1400, 9, .7], [2800, 12, .45], [3600, 14, .25]].map(([f, q, g]) => {
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q;
      const gg = ctx.createGain(); gg.gain.value = g; bp.connect(gg).connect(voice); return bp;
    });

    const syll = [];
    let t = t0;
    // Montée "hé hé hé" puis cascade "ha ha ha" qui descend
    const pitches = [560, 600, 640, 700, 720, 690, 650, 610, 570, 530, 500, 470];
    pitches.forEach((p, i) => { syll.push([t, p, 0.11]); t += 0.16 + (i % 3 === 2 ? 0.03 : 0); });
    syll.push([t + 0.05, 520, 0.75]); // "haaaaa" final qui chevrote

    syll.forEach(([st, p, dur]) => {
      const o = ctx.createOscillator(); o.type = "sawtooth";
      o.frequency.setValueAtTime(p * 0.92, st);
      o.frequency.linearRampToValueAtTime(p * 1.12, st + dur * 0.35);
      o.frequency.linearRampToValueAtTime(p * (dur > 0.5 ? 0.55 : 0.85), st + dur);
      const vib = ctx.createOscillator(), vg = ctx.createGain();
      vib.frequency.value = dur > 0.5 ? 7 : 22; vg.gain.value = dur > 0.5 ? 35 : 18;
      vib.connect(vg).connect(o.frequency);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.55, st + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, st + dur);
      o.connect(g); formants.forEach(f => g.connect(f));
      o.start(st); o.stop(st + dur + 0.05); vib.start(st); vib.stop(st + dur + 0.05);

      // souffle du "h" en début de syllabe
      const n = ctx.createBufferSource(); n.buffer = noiseBuffer(0.08);
      const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1800;
      const ng = ctx.createGain(); env(ng, st - 0.03, 0.25, 0.01, 0.05);
      n.connect(hp).connect(ng).connect(voice); n.start(st - 0.03);
    });
  }

  // Son de fin selon le thème ; tout passe par "master" pour pouvoir le couper net
  function endSound() {
    if (!audio()) return;
    stopAlarm();
    const t = ctx.currentTime;
    master = ctx.createGain(); master.gain.value = 0.9;
    const comp = ctx.createDynamicsCompressor();
    master.connect(comp).connect(ctx.destination);
    ({ halloween: endHalloween, noel: endNoel, sobre: endSobre, nouvelan: endNouvelAn, valentin: endValentin,
       carnaval: endCarnaval, paques: endPaques, poisson: endPoisson, belgique: endBelgique, nicolas: endNicolas }[skin] || endSobre)(t);
  }

  // ----- Briques sonores -----
  function tone(f, st, dur, { type = "sine", peak = .2, a = .01, to } = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type;
    o.frequency.setValueAtTime(f, st); if (to) o.frequency.exponentialRampToValueAtTime(to, st + a + dur);
    env(g, st, peak, a, dur); o.connect(g).connect(master); o.start(st); o.stop(st + a + dur + .05);
  }
  function noise(st, dur, { type = "bandpass", f = 1000, q = 1, peak = .3, a = .005 } = {}) {
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(dur + a + .05);
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = ctx.createGain(); env(g, st, peak, a, dur); n.connect(fl).connect(g).connect(master); n.start(st);
  }
  function boom(st) {
    noise(st, 1.4, { type: "lowpass", f: 900, peak: .9, a: .004 });
    tone(90, st, .8, { peak: .7, to: 35, a: .005 });
    for (let i = 0; i < 26; i++) noise(st + .25 + Math.random() * 1.2, .03, { type: "highpass", f: 3000, peak: rnd(.08, .25), a: .002 });
  }
  function bell(st, f, peak = .25, dur = 2.6) {
    [[.5, .6], [1, 1], [1.19, .5], [1.56, .35], [2, .3], [2.74, .2], [3, .12], [4.07, .08]]
      .forEach(([m, g]) => tone(f * m, st, dur * (m < 1.2 ? 1 : .6), { peak: peak * g, a: .003 }));
  }
  function trumpet(f, st, dur, peak = .2) {
    const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = f;
    const vib = ctx.createOscillator(), vg = ctx.createGain(); vib.frequency.value = 5.5; vg.gain.value = f * .008; vib.connect(vg).connect(o.frequency);
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.setValueAtTime(900, st); lp.frequency.linearRampToValueAtTime(2600, st + .06);
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, st); g.gain.exponentialRampToValueAtTime(peak, st + .04);
    g.gain.setValueAtTime(peak, st + dur - .05); g.gain.exponentialRampToValueAtTime(.0001, st + dur + .08);
    o.connect(lp).connect(g).connect(master); o.start(st); o.stop(st + dur + .1); vib.start(st); vib.stop(st + dur + .1);
  }
  function fanfare(t) {
    for (let i = 0; i < 26; i++) noise(t + i * .045, .04, { f: 2500, q: .8, peak: .05 + i * .006, a: .002 }); // roulement
    const s = t + 1.25;
    [[392, 0, .14], [523, .16, .14], [659, .32, .14], [784, .48, .42], [659, .94, .14], [784, 1.1, .9]]
      .forEach(([f, d, du]) => { trumpet(f, s + d, du); trumpet(f / 2, s + d, du, .1); });
    noise(s + 1.1, 1.8, { type: "highpass", f: 5000, peak: .22, a: .005 }); // cymbale
    return s + 2;
  }
  function jingle(t, n = 22) {
    for (let i = 0; i < n; i++) {
      const st = t + i * .11 + (i % 2 ? .02 : 0), acc = i % 4 === 0 ? 1 : .55;
      noise(st, .07, { f: 7000, q: 2, peak: .35 * acc, a: .003 });
      [2350, 3620, 5100].forEach(f => tone(f * (1 + (Math.random() - .5) * .04), st, .22, { peak: .05 * acc, a: .003 }));
    }
  }

  // Nouvel An : bouchon de champagne, pétillement, feu d'artifice
  function endNouvelAn(t) {
    noise(t, .05, { type: "highpass", f: 1500, peak: .8, a: .002 });
    tone(320, t, .12, { peak: .5, to: 120, a: .002 });
    noise(t + .05, 2, { f: 7000, q: .7, peak: .12, a: .05 });
    [.7, 1.4, 1.9, 2.7].forEach(d => boom(t + d));
  }
  // Saint-Valentin : glissando de harpe puis accord doux
  function endValentin(t) {
    [261.6, 293.7, 329.6, 392, 440, 523.3, 587.3, 659.3, 784, 880, 1046.5, 1174.7, 1318.5, 1568].forEach((f, i) => {
      const st = t + i * .07;
      tone(f, st, 1.6, { type: "triangle", peak: .12, a: .002 });
      tone(f * 2, st, .8, { peak: .035, a: .002 });
    });
    [523.3, 659.3, 784, 1046.5].forEach(f => tone(f, t + 1.3, 2.5, { peak: .07, a: .02 }));
  }
  // Carnaval : roulement de tambour + fanfare
  function endCarnaval(t) { fanfare(t); }
  // Pâques : volée de cloches
  function endPaques(t) {
    [[784, 0], [659, .55], [523, 1.1], [392, 1.65], [784, 2.4], [659, 2.95], [523, 3.5]].forEach(([f, d]) => bell(t + d, f, .2, 3));
  }
  // Poisson d'avril : bulles, sifflet à coulisse, klaxon "pouet pouet"
  function endPoisson(t) {
    for (let i = 0; i < 14; i++) tone(rnd(250, 500), t + rnd(0, 1.1), .09, { peak: .15, to: rnd(900, 1500), a: .005 });
    const st = t + 1.2, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(500, st); o.frequency.linearRampToValueAtTime(1800, st + .5); o.frequency.linearRampToValueAtTime(400, st + 1.1);
    const vib = ctx.createOscillator(), vg = ctx.createGain(); vib.frequency.value = 7; vg.gain.value = 25; vib.connect(vg).connect(o.frequency);
    env(g, st, .22, .05, 1.1); o.connect(g).connect(master); o.start(st); o.stop(st + 1.25); vib.start(st); vib.stop(st + 1.25);
    [[2.6, .16, 311, 280], [2.85, .16, 311, 280], [3.15, .7, 300, 140]].forEach(([d, du, f, to]) => {
      const s = t + d, h = ctx.createOscillator(), lp = ctx.createBiquadFilter(), hg = ctx.createGain();
      h.type = "square"; h.frequency.setValueAtTime(f, s); h.frequency.exponentialRampToValueAtTime(to, s + du);
      lp.type = "lowpass"; lp.frequency.value = 1300; env(hg, s, .25, .01, du);
      h.connect(lp).connect(hg).connect(master); h.start(s); h.stop(s + du + .05);
    });
  }
  // 21 juillet : fanfare + feu d'artifice
  function endBelgique(t) { const s = fanfare(t); [s - .6, s, s + .4].forEach(boom); }
  // Saint-Nicolas : clochettes puis l'âne qui brait
  function endNicolas(t) {
    jingle(t, 12);
    const fm = [[900, 4, .8], [2200, 6, .45]].map(([f, q, gn]) => {
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q;
      const gg = ctx.createGain(); gg.gain.value = gn * 2.2; bp.connect(gg).connect(master); return bp;
    });
    [1.5, 2.6].forEach(d => {
      [[0, .32, 950, 1050], [.36, .55, 430, 300]].forEach(([o2, du, f, to]) => {
        const s = t + d + o2, o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sawtooth"; o.frequency.setValueAtTime(f, s); o.frequency.linearRampToValueAtTime(to, s + du);
        const r = ctx.createOscillator(), rg = ctx.createGain(); r.frequency.value = 32; rg.gain.value = f * .05; r.connect(rg).connect(o.frequency);
        env(g, s, .5, .03, du); o.connect(g); fm.forEach(b => g.connect(b));
        o.start(s); o.stop(s + du + .1); r.start(s); r.stop(s + du + .1);
      });
    });
  }

  // Noël : grelots de traîneau + "Ho ho ho" grave + petit carillon
  function endNoel(t) {
    for (let i = 0; i < 22; i++) {
      const st = t + i * 0.11 + (i % 2 ? 0.02 : 0), acc = i % 4 === 0 ? 1 : 0.55;
      const n = ctx.createBufferSource(); n.buffer = noiseBuffer(0.08);
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 7000; bp.Q.value = 2;
      const ng = ctx.createGain(); env(ng, st, 0.35 * acc, 0.003, 0.07);
      n.connect(bp).connect(ng).connect(master); n.start(st);
      [2350, 3620, 5100].forEach(f => {
        const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = f * (1 + (Math.random() - .5) * 0.04);
        const g = ctx.createGain(); env(g, st, 0.05 * acc, 0.003, 0.22);
        o.connect(g).connect(master); o.start(st); o.stop(st + 0.3);
      });
    }
    const voice = ctx.createGain(); voice.gain.value = 1.3;
    const dly = ctx.createDelay(1), fb = ctx.createGain(); dly.delayTime.value = 0.09; fb.gain.value = 0.25;
    voice.connect(master); voice.connect(dly); dly.connect(fb).connect(dly); dly.connect(master);
    const formants = [[480, 6, 1], [820, 7, .55], [2600, 10, .18]].map(([f, q, g]) => {
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q;
      const gg = ctx.createGain(); gg.gain.value = g; bp.connect(gg).connect(voice); return bp;
    });
    [[0.25, 0.3, 128], [0.75, 0.3, 120], [1.25, 0.7, 112]].forEach(([d, dur, p]) => {
      const st = t + d;
      const o = ctx.createOscillator(); o.type = "sawtooth";
      o.frequency.setValueAtTime(p, st); o.frequency.linearRampToValueAtTime(p * 0.8, st + dur);
      const vib = ctx.createOscillator(), vg = ctx.createGain(); vib.frequency.value = 5; vg.gain.value = 3;
      vib.connect(vg).connect(o.frequency);
      const g = ctx.createGain(); env(g, st, 0.8, 0.03, dur);
      o.connect(g); formants.forEach(f => g.connect(f));
      o.start(st); o.stop(st + dur + 0.1); vib.start(st); vib.stop(st + dur + 0.1);
      const n = ctx.createBufferSource(); n.buffer = noiseBuffer(0.1);
      const hb = ctx.createBiquadFilter(); hb.type = "bandpass"; hb.frequency.value = 1200;
      const ng = ctx.createGain(); env(ng, st - 0.05, 0.3, 0.02, 0.06);
      n.connect(hb).connect(ng).connect(voice); n.start(st - 0.05);
    });
    [1046.5, 1318.5, 1568, 2093].forEach((f, i) => {
      const st = t + 2.3 + i * 0.14;
      [1, 2.76].forEach((m, k) => {
        const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = f * m;
        const g = ctx.createGain(); env(g, st, k ? 0.05 : 0.18, 0.005, 1.4);
        o.connect(g).connect(master); o.start(st); o.stop(st + 1.5);
      });
    });
  }

  // Sobre : 4 séries de trois bips
  function endSobre(t) {
    for (let r = 0; r < 4; r++) [0, 0.18, 0.36].forEach((d, i) => {
      const st = t + r * 1.1 + d, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "square"; o.frequency.value = i === 2 ? 1320 : 880; env(g, st, 0.25, 0.02, 0.13);
      o.connect(g).connect(master); o.start(st); o.stop(st + 0.2);
    });
  }

  // Halloween : impact + grondement + rire de sorcière
  function endHalloween(t) {
    // Impact (jumpscare)
    const hit = ctx.createBufferSource(); hit.buffer = noiseBuffer(1.2);
    const hf = ctx.createBiquadFilter(); hf.type = "lowpass";
    hf.frequency.setValueAtTime(2500, t); hf.frequency.exponentialRampToValueAtTime(80, t + 1);
    const hg = ctx.createGain(); env(hg, t, 1, 0.005, 1.1);
    hit.connect(hf).connect(hg).connect(master); hit.start(t);

    // Grondement grave
    const sub = ctx.createOscillator(); sub.type = "sine";
    sub.frequency.setValueAtTime(70, t); sub.frequency.exponentialRampToValueAtTime(30, t + 4.5);
    const sg = ctx.createGain(); env(sg, t, 0.7, 0.02, 4.5);
    sub.connect(sg).connect(master); sub.start(t); sub.stop(t + 4.7);

    // Nappe dissonante discrète sous le rire
    [110, 116.5, 155.6].forEach((f, i) => {
      const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = f;
      o.detune.linearRampToValueAtTime(-80 - i * 20, t + 4.5);
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 700;
      const g = ctx.createGain(); env(g, t + 0.05, 0.07, 0.4, 4);
      o.connect(lp).connect(g).connect(master); o.start(t); o.stop(t + 4.6);
    });

    cackle(t + 0.45, master);
  }
  function stopAlarm() {
    if (master) { try { master.gain.cancelScheduledValues(0); master.gain.value = 0; master.disconnect(); } catch (e) {} master = null; }
  }

  // ---------- Écran allumé ----------
  async function lockScreen() { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {} }
  function releaseLock() { try { wakeLock?.release(); } catch (e) {} wakeLock = null; }

  // ---------- Mode projection ----------
  function setFs(on) {
    body.classList.toggle("fs", on);
    $("fs").textContent = on ? "Quitter la projection" : "Mode projection";
  }
  function toggleFs() {
    const on = !body.classList.contains("fs");
    setFs(on);
    try {
      if (on) document.documentElement.requestFullscreen?.().catch(() => {});
      else if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    } catch (e) {}
  }
  document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) setFs(false); });

  // ---------- Événements ----------
  startBtn.onclick = toggle; display.onclick = toggle;
  $("resetBtn").onclick = reset;
  document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => add(+b.dataset.add));
  // Enregistre la durée saisie (sur Entrée ou en quittant le champ) ; ne réinitialise que si elle a changé
  function applyManual() {
    const s = parse($("manual").value);
    if (s == null || s === total) { $("manual").value = fmt(total); return; }
    total = s; save(); reset(); $("manual").value = fmt(total);

    nicolas: [() => makeWalker(WALKERS_SN), () => makeWalker(WALKERS_SN), makeShoot, () => makeBurst(["#e8b84a", "#f39c12", "#ffffff"], { shape: "dot" })]
  });

  function spawnEntity() {
    const list = SPAWN[skin] || [];
    if (!list.length) return;
    const el = list[Math.floor(Math.random() * list.length)]();
    if (!el) return;
    deco.insertBefore(el, vign);
    if (el._after) el._after();
    else el.addEventListener("animationend", e => { if (e.target === el) el.remove(); });
    setTimeout(() => el.remove(), el._life || 12000);
  }
  // Une apparition peut faire surgir plusieurs entités d'un coup, légèrement décalées
  function spawnGroup() {
    const urgent = body.classList.contains("danger"), p = Math.random();
    const n = urgent ? (p < .3 ? 1 : p < .7 ? 2 : p < .9 ? 3 : 4) : (p < .5 ? 1 : p < .85 ? 2 : 3);
    for (let i = 0; i < n; i++) setTimeout(spawnEntity, i === 0 ? 0 : rnd(300, 1800) * i);
  }
  function scheduleEntity() {
    const urgent = body.classList.contains("danger");
    setTimeout(() => {
      if (!document.hidden && !matchMedia("(prefers-reduced-motion: reduce)").matches) spawnGroup();
      scheduleEntity();
    }, (urgent ? rnd(4, 10) : rnd(10, 25)) * 1000);
  }
  setTimeout(() => { spawnGroup(); scheduleEntity(); }, rnd(3, 8) * 1000);
})();
</script>
